name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Engine dependency purity check
        run: pnpm check:engine-purity
        # Scoped rule (plan §13 DoD, amended 2026-08-02): packages/engine must have zero
        # runtime dependencies and never import react/react-dom/next. This is NOT a
        # repo-wide ban — @twist-arcade/shell (a future UI package) is explicitly permitted
        # to depend on React for real; only packages/engine is constrained. See
        # scripts/check-engine-purity.mjs.

      # Harness CI suites (packages/harness) and the size-limit budget check land in M3/M4;
      # this workflow is the M0 skeleton only — typecheck -> lint -> test -> engine purity.
