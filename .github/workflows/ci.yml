name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The DY1 guards below run `git diff origin/main...HEAD`. The default shallow
          # clone (fetch-depth: 1) has no base history, so the diff either errors or —
          # worse — silently produces the wrong answer. See packages/daily/CI.md trap 1.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Engine dependency purity check
        run: pnpm check:engine-purity
        # Scoped rule (plan §13 DoD, amended 2026-08-02): packages/engine must have zero
        # runtime dependencies and never import react/react-dom/next. This is NOT a
        # repo-wide ban — @twist-arcade/shell (a future UI package) is explicitly permitted
        # to depend on React for real; only packages/engine is constrained. See
        # scripts/check-engine-purity.mjs.

      - name: Per-game harness CI gates (M4)
        run: pnpm harness:ci-gates -- --suite ci
        # Wires the ALREADY-BUILT harness suites (packages/harness/src/ci-gates.ts composes
        # suites.ts for two-player games and solo-gates.ts/probes-solo.ts/solo-runner.ts for
        # solo games) over every entry in games/registry.ts, keyed by manifest.solo.format —
        # never by player count (platform-corrections.md C2). Exits non-zero the moment any
        # registered game fails its gate table (plan §7.5, roadmap §6). A no-op ("nothing to
        # gate yet") until the first game registers — see scripts/ci-gates.ts's own doc.

      # --- DY1 daily guards -------------------------------------------------------
      # These enforce the daily comparability contract. Without them a committed retune
      # of a shipped manifest merges green, which is the entire thing DY1 exists to stop.
      # `--today` is computed here rather than left to the runner's clock: a skewed or
      # mistimed runner could free a day that has already shipped, or freeze one that
      # has not. See packages/daily/CI.md.
      - name: Compute today's UTC date
        id: today
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Guard — shipped daily manifests are immutable
        run: pnpm --filter @twist-arcade/daily run guard:immutability -- --today ${{ steps.today.outputs.date }}

      - name: Guard — era.json changes carry a CHANGELOG entry
        run: pnpm --filter @twist-arcade/daily run guard:era-changelog

      - name: Guard — manifests valid, contiguous, and buffered
        run: pnpm --filter @twist-arcade/daily run guard:manifests -- --today ${{ steps.today.outputs.date }}

      - name: Build (production)
        run: pnpm build

      - name: Bundle size budget (size-limit, plan §7.5/roadmap §6)
        run: pnpm size-limit
        # .size-limit.json: 75 kB gz per game route (app/play/[gameId]) and the catalog route
        # (app/page.tsx) must not grow past its own budget. Runs against the `next build`
        # output from the previous step — must stay AFTER Build in this job's ordering.

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E + a11y gate (Playwright + axe, plan §11.2/§11.3)
        run: pnpm test:e2e
        # Scope note (shell team, S1): the registry is still empty (no game has a presentation
        # yet), so this currently exercises "/" and the unknown-gameId 404 path only — see
        # playwright.config.ts and e2e/a11y.spec.ts for what's deferred until a real game
        # lands (cold-load timing, keyboard-only play, the 320px cell floor, reduced-motion
        # parity, the input lockout, persistence resume).
